name: "KoPass A2A card check"
description: "Validate an A2A agent card with the public KoPass validator."
author: "KoPass"
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  url:
    description: "URL of the A2A agent or agent card to validate."
    required: true
  fail-on:
    description: "Validation threshold: error, warning, or never."
    required: false
    default: "error"
  api-url:
    description: "Base URL of the KoPass API."
    required: false
    default: "https://kopass.app"

outputs:
  grade:
    description: "KoPass validation grade."
    value: ${{ steps.check.outputs.grade }}
  valid:
    description: "Whether KoPass considers the card valid."
    value: ${{ steps.check.outputs.valid }}
  reachable:
    description: "Whether KoPass could reach the card."
    value: ${{ steps.check.outputs.reachable }}
  report-url:
    description: "KoPass agent page when known, otherwise the validator URL."
    value: ${{ steps.check.outputs.report-url }}

runs:
  using: "composite"
  steps:
    - id: check
      name: Check A2A card with KoPass
      shell: bash
      env:
        A2A_CARD_URL: ${{ inputs.url }}
        A2A_FAIL_ON: ${{ inputs.fail-on }}
        A2A_API_URL: ${{ inputs.api-url }}
      run: bash "$GITHUB_ACTION_PATH/scripts/check.sh"
